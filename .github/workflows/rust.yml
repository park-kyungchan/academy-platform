name: Rust
# Budget rule (private repository, the plan's included minutes): a push to a DRAFT pull request does not run the job;
# the agent's run of `./check` on the host is the evidence for a part. The job runs when the pull request is
# ready for review, on every push after that, on main, and on demand (`gh workflow run rust.yml --ref <branch>`).
# A draft pull request cannot be merged, so the required check `rust` is always a real run on the merged head.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('rust-pr-{0}', github.ref) || format('rust-push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    name: rust
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply docs-only paths-ignore semantics inside the always-run job
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_rust=true
          # A pull request that is marked ready AGAIN on a head this job already passed (a draft
          # and ready toggle asks the automatic reviewer for a pushed head) does not build a
          # second time: the earlier run on the same head commit is the evidence. This rests on
          # the ruleset's rule that a branch is up to date before it merges: the tree the earlier
          # run tested is then the head's tree. A reading that fails counts as no earlier run.
          if [[ "${EVENT_ACTION:-}" == ready_for_review && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            passed="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=rust&status=completed&per_page=100" --jq '[.check_runs[] | select(.conclusion == "success" and .app.slug == "github-actions" and .head_sha == env.HEAD_SHA)] | length' 2>/dev/null || echo 0)"
            if [[ "$passed" =~ ^[1-9][0-9]*$ ]]; then
              echo "this head passed the job before ($passed run): not built again"
              echo "run_rust=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            # imported/ is never built or tested here: a change there alone does not run the build either.
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- . ':!docs/**' ':!README.md' ':!imported/**'; then
              run_rust=false
            fi
          fi
          echo "run_rust=$run_rust" >> "$GITHUB_OUTPUT"
      - name: Install pinned Rust toolchain
        if: steps.scope.outputs.run_rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: steps.scope.outputs.run_rust == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch the private engine dependency
        if: steps.scope.outputs.run_rust == 'true'
        shell: bash
        env:
          ONTOLOGY_PLATFORM_DEPLOY_KEY: ${{ secrets.ONTOLOGY_PLATFORM_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          key_file="$work/key"
          known_hosts="$work/known_hosts"
          printf '%s\n' "$ONTOLOGY_PLATFORM_DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' > "$known_hosts"
          if [ ! -s "$known_hosts" ]; then
            echo "no GitHub host keys were read" >&2
            exit 1
          fi
          ssh_command="ssh -i $(printf %q "$key_file") -o IdentitiesOnly=yes -o UserKnownHostsFile=$(printf %q "$known_hosts") -o StrictHostKeyChecking=yes"
          CARGO_NET_GIT_FETCH_WITH_CLI=true \
          GIT_SSH_COMMAND="$ssh_command" \
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=url.ssh://git@github.com/park-kyungchan/ontology-platform.insteadOf \
          GIT_CONFIG_VALUE_0=https://github.com/park-kyungchan/ontology-platform \
          cargo fetch --locked
          rm -f "$key_file" "$known_hosts"
          unset ONTOLOGY_PLATFORM_DEPLOY_KEY GH_TOKEN
      - name: Check
        if: steps.scope.outputs.run_rust == 'true'
        run: ./check
