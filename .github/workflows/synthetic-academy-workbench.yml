name: Synthetic academy workbench
on:
  pull_request:
    paths:
      - 'packages/academy-workbench/**'
      - 'src/academy/classroomCyclePolicy.ts'
      - '.github/workflows/synthetic-academy-workbench.yml'
  push:
    branches: [main]
    paths:
      - 'packages/academy-workbench/**'
      - 'src/academy/classroomCyclePolicy.ts'
      - '.github/workflows/synthetic-academy-workbench.yml'
permissions:
  contents: read
jobs:
  synthetic-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/academy-workbench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7; same pinned action as repository CI
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2; same pinned action as repository CI
        with:
          bun-version: 1.4.2
      - name: Install exact dependencies
        run: bun install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org
      - name: Typecheck, semantic fixtures, synthetic tests and build
        run: bun run check
