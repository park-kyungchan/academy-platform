[workspace]
members = ["crates/edu-academy-core", "crates/edu-academy-sources"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
ryu-js = "=1.0.2"
sha2 = "=0.10.9"
regex = "=1.12.2"
scraper = { version = "=0.29.0", default-features = false }
chrono-tz = { version = "=0.10.4", default-features = false, features = ["case-insensitive"] }

html5ever = "=0.40.1"
rustix = { version = "=1.1.2", features = ["fs", "process"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
